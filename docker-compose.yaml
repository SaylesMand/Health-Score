services:
  api:
    build: .
    container_name: health_score_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./alembic/versions:/app/alembic/versions
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ml_network

  frontend:
    build: .
    container_name: health_score_frontend
    restart: unless-stopped
    environment:
      API_URL: "http://api:8000/api"
    command: ["streamlit", "run", "frontend/main.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true", "--browser.gatherUsageStats=false"]
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ml_network

  worker:
    build: .
    container_name: health_score_worker
    restart: unless-stopped
    env_file:
      - .env
    command: ["celery", "-A", "app.tasks.config.celery_app", "worker", "--loglevel=info", "-P", "threads", "--concurrency=2"]
    volumes:
      - ./logs:/app/logs
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - ml_network

  beat:
    build: .
    container_name: health_score_beat
    restart: unless-stopped
    env_file:
      - .env
    command: ["celery", "-A", "app.tasks.config.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    volumes:
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    networks:
      - ml_network

  prometheus:
    image: prom/prometheus:v2.53.5
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - ml_network

  grafana:
    image: grafana/grafana:13.1.0-25196703233-ubuntu
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - ml_network

  db:
    image: postgres:17-alpine
    container_name: health_score_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ml_network

  redis:
    image: redis:7-alpine
    container_name: health_score_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ml_network

volumes:
  postgres_data:
  grafana_data:

networks:
  ml_network:
    driver: bridge
